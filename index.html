<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Skills Test</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            background-color: #fec007;
        }
        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fec007;
        }

        details{
            align-items: center;
        }

        .card{
            align-items: center;
            width: 600px;
            background-color: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 0 auto;
        }

        input[type="text"]{
            width: 340px;
        }

        input[type="checkbox"] {
            accent-color: #fec007;
        }

        button{
            width: 340px;
        }

        hr{
            width: 340px;
        }

        a{
            margin: 50px;
        }
    </style>

</head>
<body>


    <div class="container">
        <div class="card">
            <img src="logogogogogogogo-removebg-preview.png" alt="School Logo">
            <h1 class="text-dark">Hogwarts Account Login</h1>

            <button type="button" class="btn btn-sm btn-outline-warning mb-1 center" 
            onclick="alert('To log in, enter Username: wingardium & Password: leviosa')">View Login Help</button>
            <hr>

            <label class="text-dark">Username</h3>
            <input type="text" class="form-control" id="usernameEntry">
            <br>
            <label class="text-dark">Password</h3>
            <input type="text" class="form-control" id="passwordEntry">

            <input type="checkbox" class="mt-4">
            <label>Stay logged in?</label><br>
            <p class="mb-4"><i>Your session will stay active on this device.</i></p>

            <p id="result" class="text-muted mt-2"></p>
            <button type="button" class="btn btn-warning" onclick="loginUser()">Log In</button>
        
            <hr>
            <u>Forgot password?</u>
        </div>
    </div>

<script src="main.js"></script>
</body>
</html>
